services:
  - type: web
    name: henriched-digital-services
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://henriched-digital-services.onrender.com
      - key: CORS_ORIGINS
        value: https://henriched-digital-services.onrender.com
      - key: WHATSAPP_NUMBER
        sync: false
